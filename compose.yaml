services:
  app:
    build: .
    environment:
      WORK_AGENT_DATA_DIR: /data
      OPENAI_API_KEY:
      OPENAI_BASE_URL:
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:${WORK_AGENT_PORT:-8000}:8000"
    volumes:
      - agent-data:/data
    restart: unless-stopped

volumes:
  agent-data:
