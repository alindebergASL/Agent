{% extends "base.html" %}
{% block title %}{{ name }} · Work Agent{% endblock %}
{% block body %}
<a class="back" href="{{ url_for('assignment', task_id=task_id) }}">← Assignment</a>
<section class="panel">
  <div class="heading">
    <h1>{{ name }}</h1>
    <a class="download" href="?download=1">Download original</a>
  </div>
  {% if lines %}
  <ol class="source-lines" aria-label="Original file lines">
    {% for line in lines %}
    <li id="L{{ loop.index }}"><a href="#L{{ loop.index }}" aria-label="Line {{ loop.index }}">{{ loop.index }}</a><code>{{ line }}</code></li>
    {% endfor %}
  </ol>
  {% else %}
  <p>This file is empty.</p>
  {% endif %}
</section>
{% endblock %}
