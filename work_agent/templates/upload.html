{% extends "base.html" %}
{% block title %}{{ name }} · Work Agent{% endblock %}
{% block body %}
<a class="back" href="{{ url_for('assignment', task_id=task_id) }}">← Assignment</a>
<section class="panel">
  <div class="heading">
    <h1>{{ name }}</h1>
    <a class="download" href="?download=1">Download original</a>
  </div>
  <p><a href="{{ url_for('new_from_upload', task_id=task_id, name=name|urlencode) }}">Start an assignment with this original</a></p>
  <p><a href="{{ url_for('evidence_uses', task_id=task_id, kind='upload', name=name|urlencode) }}">Where this original was used</a></p>
  {% include "source_lines.html" %}
</section>
{% endblock %}
