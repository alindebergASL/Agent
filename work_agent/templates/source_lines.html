{% if lines %}
<ol class="source-lines" aria-label="Original file lines">
  {% for line in lines %}
  {% set number = first_line|default(1) + loop.index0 %}
  <li id="L{{ number }}"><a href="{{ line_query|default('') }}#L{{ number }}" aria-label="Line {{ number }}">{{ number }}</a><code>{{ line }}</code></li>
  {% endfor %}
</ol>
{% else %}
<p>This file is empty.</p>
{% endif %}
